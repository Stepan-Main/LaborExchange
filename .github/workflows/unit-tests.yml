name: CI Pipeline

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, review_requested, submitted]
    branches:
      - develop

jobs:
  # Перевірка схвалення рев'ю перед злиттям
# Перевірка схвалення рев'ю перед злиттям
  review-check:
    name: Code Review Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Review Status
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            // 1. Отримуємо офіційні рев'ю
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            // 2. Отримуємо текстові коментарі з PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            // Перевіряємо статус APPROVED або наявність слова APPROVE у коментарях чи рев'ю
            const hasApprovedReview = reviews.some(r => r.state === 'APPROVED' || (r.body && r.body.toUpperCase().includes('APPROVE')));
            const hasApprovedComment = comments.some(c => c.body && c.body.toUpperCase().includes('APPROVE'));

            if (!hasApprovedReview && !hasApprovedComment) {
              core.setFailed("Код-рев'ю не схвалено! Залиште коментар 'APPROVE' для злиття в develop.");
            } else {
              console.log("Код-рев'ю успішно схвалено через APPROVE.");
            }

  # Збірка, Cloc, MSTest та аналіз Sonar на Windows
  build-test-and-sonar:
    name: Build, MSTest & Sonar Analysis
    needs: review-check
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Потрібно для точного аналізу історії Sonar

      - name: Setup Java (потрібно для Sonar)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup VSTest
        uses: darenm/setup-vstest@v1.2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      # Підрахунок рядків коду Cloc для Windows
      - name: Count lines of code with Cloc
        shell: powershell
        run: |
          choco install cloc -y
          cloc LaborExchange_System\ LaborExchange_System.Tests\ --out=cloc-report.txt
          Get-Content cloc-report.txt

      # Збереження звіту як артефакту
      - name: Save Cloc report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloc-report
          path: cloc-report.txt

      - name: Install SonarScanner for .NET
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Restore NuGet packages
        run: nuget restore LaborExchange_System.sln

      # Сесія Sonar
      - name: Begin Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"LaborExchange_System" `
            /o:"stepan-main" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.host.url="https://sonarcloud.io"

      # Компіляція розв'язку
      - name: Build Solution
        run: msbuild LaborExchange_System.sln /p:Configuration=Release

      # Запуск MSTest із попередньої ЛР
      - name: Run MSTest Unit Tests
        run: vstest.console.exe LaborExchange_System.Tests\bin\Release\LaborExchange_System.Tests.dll

      # Завершення аналізу та вивантаження результатів у Sonar
      - name: End Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"